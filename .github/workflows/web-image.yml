name: Web image

# 网页版镜像：构建 + 容器冒烟 + 漏洞扫描（非阻断）。
#
# 托管构建仅按需手动运行；本地验收和服务器手工发布不依赖此工作流。
on:
  workflow_dispatch:

# 默认零令牌权限；仅 checkout 的 job 按需申请 contents: read。
permissions: {}

concurrency:
  group: web-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: build and smoke / web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        # 语料向量文件是普通 tracked 文件（约 39MB，非 LFS），默认 checkout 即可完整取出。
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the web image
        # 构建上下文 = 仓库根；不传 PIP_INDEX_URL，GitHub runner 直连 PyPI 更快。
        run: "docker build -f deploy/web/Dockerfile -t biodata-web:ci ."

      - name: Smoke-test the container
        # 与手工发布共用的唯一实现：动态 loopback 端口、账户护栏与未登录 401 断言、
        # 只清理带本次 label 的临时容器。CI 不复制第二份内联 smoke。
        run: python3 scripts/smoke_web_image.py --image biodata-web:ci --require-account

      - name: Scan the image for known vulnerabilities (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "biodata-web:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          format: "table"
          # 关闭 actions/cache：避免为缓存放开 actions 写权限；扫描完整执行，仅每次重下 Trivy 漏洞库。
          cache: "false"
        # 刻意非阻断：exit-code 恒为 0，只把 CRITICAL/HIGH 以 table 形式可视化，暂不卡门。
        # 卡门策略（如 exit-code 置 1 + 明确 .trivyignore 忽略清单）留待后续再定。
