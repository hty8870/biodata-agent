version: 2
# 局限（验证）：CI/候选发布实际以 --require-hashes 安装 uv 生成的 requirements/requirements-ci.lock。
# Dependabot 的 pip 生态**不识别 .lock 扩展**（dependabot-core#9368），只会对 requirements*.txt 开 PR，
# **不会**重生成该 lock；合并这类 PR 后 CI 仍装旧 lock，绿灯是"假新鲜"。因此 pip PR 视作**建议性**：
# 合并前须人工/工具重跑 `uv pip compile requirements/requirements-ci.txt --generate-hashes -o requirements/requirements-ci.lock`
# 使 lock 同步。（有远程后可加一条 CI 步骤：重生成 lock 并在与提交版不一致时 fail，把漂移变成硬门。）
# （一级目录整理：requirements 群迁入 requirements/，pip 生态 directory 随迁。）
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      ci-python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
